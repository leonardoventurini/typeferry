[workspace]
resolver = "2"
members = [
    "crates/bifrost-ejson",
    "crates/bifrost-protocol",
    "crates/bifrost-runtime",
    "crates/bifrost-http",
    "crates/bifrost-ws",
    "crates/bifrost-redis",
    "crates/bifrost-auth",
    "crates/bifrost-macros",
    "crates/bifrost-conformance-server",
    "crates/bifrost-conformance",
    "crates/bifrost",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://forgejo.example-app.com/leonardoventurini/bifrost"
authors = ["Leonardo Venturini"]
publish = ["forgejo"]

[workspace.dependencies]
# Inter-crate bifrost-* deps live here so a single `[workspace.package]`
# version bump cascades automatically. Per-crate Cargo.toml refers to
# them via `{ workspace = true }`. The release-bump CI script also
# rewrites these `version = ...` pins when it changes the workspace
# version.
#
# `registry = "forgejo"` is REQUIRED for `cargo publish` to look up
# the dep in our Forgejo registry instead of crates.io. Without it,
# cargo strips the `path` at publish time, falls back to the default
# registry, and fails with "no matching package named `bifrost-*`
# found, location searched: crates.io index".
bifrost-protocol = { path = "crates/bifrost-protocol", version = "0.2.0", registry = "forgejo" }
bifrost-ejson    = { path = "crates/bifrost-ejson",    version = "0.2.0", registry = "forgejo" }
bifrost-runtime  = { path = "crates/bifrost-runtime",  version = "0.2.0", registry = "forgejo" }
bifrost-http     = { path = "crates/bifrost-http",     version = "0.2.0", registry = "forgejo" }
bifrost-ws       = { path = "crates/bifrost-ws",       version = "0.2.0", registry = "forgejo" }
bifrost-redis    = { path = "crates/bifrost-redis",    version = "0.2.0", registry = "forgejo" }
bifrost-auth     = { path = "crates/bifrost-auth",     version = "0.2.0", registry = "forgejo" }
bifrost-macros   = { path = "crates/bifrost-macros",   version = "0.2.0", registry = "forgejo" }

# Shared runtime dependencies. Pin conservatively; individual crates
# opt in via their own Cargo.toml.
tokio = { version = "1.47", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
futures = "0.3"
tracing = "0.1"
anyhow = "1.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tokio-tungstenite = "0.27"
redis = { version = "0.32", features = ["tokio-comp"] }
jsonwebtoken = "9.3"
reqwest = { version = "0.12", features = ["json"] }
