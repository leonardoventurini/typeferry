[package]
name = "bifrost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Type-safe real-time RPC framework — single-import meta crate that re-exports the runtime, transports, auth, and authoring macros"
keywords = ["rpc", "websocket", "ejson", "axum", "realtime"]
categories = ["network-programming", "web-programming", "asynchronous"]

[dependencies]
bifrost-protocol = { workspace = true }
bifrost-ejson = { workspace = true }
bifrost-runtime = { workspace = true }
bifrost-http = { workspace = true, optional = true }
bifrost-ws = { workspace = true, optional = true }
bifrost-redis = { workspace = true, optional = true }
bifrost-auth = { workspace = true, optional = true }
bifrost-macros = { workspace = true, optional = true }

[features]
default = ["http", "ws", "macros"]
http = ["dep:bifrost-http"]
ws = ["dep:bifrost-ws"]
redis = ["dep:bifrost-redis"]
auth = ["dep:bifrost-auth"]
macros = ["dep:bifrost-macros"]
full = ["http", "ws", "redis", "auth", "macros"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
