[package]
name = "bifrost"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Type-safe real-time RPC framework — single-import meta crate that re-exports the runtime, transports, auth, and authoring macros"
keywords = ["rpc", "websocket", "ejson", "axum", "realtime"]
categories = ["network-programming", "web-programming", "asynchronous"]

[dependencies]
bifrost-protocol = { path = "../bifrost-protocol", version = "0.0.1" }
bifrost-ejson    = { path = "../bifrost-ejson",    version = "0.0.1" }
bifrost-runtime  = { path = "../bifrost-runtime",  version = "0.0.1" }
bifrost-http     = { path = "../bifrost-http",     version = "0.0.1", optional = true }
bifrost-ws       = { path = "../bifrost-ws",       version = "0.0.1", optional = true }
bifrost-redis    = { path = "../bifrost-redis",    version = "0.0.1", optional = true }
bifrost-auth     = { path = "../bifrost-auth",     version = "0.0.1", optional = true }
bifrost-macros   = { path = "../bifrost-macros",   version = "0.0.1", optional = true }

[features]
default = ["http", "ws", "macros"]
http = ["dep:bifrost-http"]
ws = ["dep:bifrost-ws"]
redis = ["dep:bifrost-redis"]
auth = ["dep:bifrost-auth"]
macros = ["dep:bifrost-macros"]
full = ["http", "ws", "redis", "auth", "macros"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
