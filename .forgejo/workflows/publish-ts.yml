name: Publish (bifrost-ts)

# Triggers on push to main when any TypeScript package file changes.
# Idempotent: skips when bifrost-ts/package.json's version is already
# on the Forgejo npm registry.

on:
  push:
    branches: [main]
    paths:
      - 'bifrost-ts/package.json'
      - 'bifrost-ts/src/**'
      - 'bifrost-ts/scripts/**'
      - 'bifrost-ts/tsconfig*.json'
      - '.forgejo/workflows/publish-ts.yml'

concurrency:
  group: publish-ts
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: arm64
    # Only run when the head commit is a release-bot bump. Regular
    # feature/fix pushes flow through release-bump.yml first, which
    # creates a chore(release) commit that lands here.
    if: startsWith(forgejo.event.head_commit.message, 'chore(release):')
    defaults:
      run:
        working-directory: bifrost-ts
    env:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      REGISTRY: https://forgejo.example-app.com/api/packages/leonardoventurini/npm/
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$FORGEJO_PATH"

      - name: Resolve target version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$FORGEJO_OUTPUT"
          echo "name=$name" >> "$FORGEJO_OUTPUT"

      - name: Skip if version already published
        id: gate
        run: |
          set +e
          out=$(npm view "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}" version \
            --registry "$REGISTRY" 2>&1)
          if [ "$out" = "${{ steps.version.outputs.version }}" ]; then
            echo "already_published=true" >> "$FORGEJO_OUTPUT"
            echo "${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} is already on Forgejo; skipping."
          else
            echo "already_published=false" >> "$FORGEJO_OUTPUT"
          fi

      - run: bun install --frozen-lockfile
        if: steps.gate.outputs.already_published == 'false'

      - name: Build
        if: steps.gate.outputs.already_published == 'false'
        run: bun run build

      - name: Publish
        if: steps.gate.outputs.already_published == 'false'
        run: bun publish --access public
