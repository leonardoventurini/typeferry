name: Release bump

# Watches push events on main, scans Conventional Commits since the
# last `chore(release):` commit, and if any of bifrost-{ts,py,rs}
# needs a version bump, opens a release commit on top of main. The
# new commit then triggers the matching `Publish (...)` workflow.

on:
  push:
    branches: [main]
    # Skip pushes that only touched docs / fixtures / CI plumbing —
    # nothing in those paths is publishable.
    paths:
      - 'bifrost-ts/**'
      - 'bifrost-py/**'
      - 'bifrost-rs/**'

concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump
    runs-on: arm64

    # Loop guards. The first one is a fast-path: if HEAD is already a
    # release commit, no further bumping is needed for this push.
    # The second guards against the bot pushing under its own actor
    # name (defence in depth).
    if: >-
      !startsWith(forgejo.event.head_commit.message, 'chore(release):')
      && forgejo.actor != 'release-bot'

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          # Need full history so we can locate the prior chore(release).
          fetch-depth: 0
          # Use the bot token so the bot's push triggers downstream
          # publish workflows. (Default GITHUB_TOKEN-style tokens
          # often don't trigger sibling workflows.)
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Resolve system Python 3.13
        run: |
          if command -v python3.13 >/dev/null 2>&1; then
            python_bin=$(command -v python3.13)
          else
            python_bin=$(command -v python3)
          fi
          echo "PYTHON=$python_bin" >> "$FORGEJO_ENV"
          $python_bin --version

      - name: Compute bumps
        id: bump
        run: |
          $PYTHON scripts/bump-versions.py --json > /tmp/bumps.json
          cat /tmp/bumps.json
          count=$($PYTHON -c "import json; print(len(json.load(open('/tmp/bumps.json'))['bumps']))")
          echo "count=$count" >> "$FORGEJO_OUTPUT"

      - name: Commit + push release
        if: steps.bump.outputs.count != '0'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          summary=$($PYTHON -c "
          import json
          data = json.load(open('/tmp/bumps.json'))
          parts = [f\"{b['package']} {b['old_version']} → {b['new_version']}\" for b in data['bumps']]
          print(', '.join(parts))
          ")
          body=$($PYTHON -c "
          import json
          data = json.load(open('/tmp/bumps.json'))
          for b in data['bumps']:
              print(f\"- {b['package']}: {b['old_version']} → {b['new_version']} ({b['level']})\")
          ")

          git config user.name 'release-bot'
          git config user.email 'release-bot@example-app.com'

          # Stage every manifest the script touched.
          $PYTHON -c "
          import json
          data = json.load(open('/tmp/bumps.json'))
          for b in data['bumps']:
              for f in b['changed_files']:
                  print(f)
          " | xargs git add

          git commit -m "chore(release): $summary" -m "$body"
          git push origin HEAD:main
