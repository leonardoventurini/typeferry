name: Publish (bifrost-rs)

# Triggers on push to main when any Rust package file changes.
# Publishes every workspace crate that has `publish.workspace = true`
# in dependency order, skipping any already on the registry.

on:
  push:
    branches: [main]
    paths:
      - 'bifrost-rs/Cargo.toml'
      - 'bifrost-rs/crates/**'
      - '.forgejo/workflows/publish-rs.yml'

concurrency:
  group: publish-rs
  cancel-in-progress: false

# Dependency order — each crate is published only after every crate it
# depends on is on the registry. The umbrella `bifrost` crate goes
# last; conformance crates are publish=false and excluded.
env:
  CRATES: >-
    bifrost-protocol
    bifrost-ejson
    bifrost-runtime
    bifrost-http
    bifrost-ws
    bifrost-redis
    bifrost-auth
    bifrost-macros
    bifrost
  REGISTRY_INDEX: sparse+https://forgejo.example-app.com/api/packages/leonardoventurini/cargo/
  REGISTRY_API: https://forgejo.example-app.com/api/packages/leonardoventurini/cargo/api/v1/crates

jobs:
  publish:
    name: publish
    runs-on: arm64
    defaults:
      run:
        working-directory: bifrost-rs
    env:
      # Job-scoped CARGO_HOME so we don't trample the developer's
      # local ~/.cargo on the self-hosted runner.
      CARGO_HOME: ${{ forgejo.workspace }}/.ci-cargo
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Resolve cargo binary
        # Self-hosted runner: the user has cargo installed but the
        # runner shell doesn't source their rc files, and the
        # FORGEJO_PATH mechanism hasn't been reliable for this job.
        # Resolve cargo's absolute path here and propagate it via
        # FORGEJO_ENV so subsequent steps invoke `$CARGO` directly.
        run: |
          if command -v cargo >/dev/null 2>&1; then
            cargo_bin=$(command -v cargo)
          elif [ -x "$HOME/.cargo/bin/cargo" ]; then
            cargo_bin="$HOME/.cargo/bin/cargo"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            cargo_bin="$HOME/.cargo/bin/cargo"
          fi
          echo "CARGO=$cargo_bin" >> "$FORGEJO_ENV"
          $cargo_bin --version

      - name: Configure Forgejo Cargo registry (job-scoped)
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          mkdir -p "$CARGO_HOME"
          cat > "$CARGO_HOME/config.toml" <<EOF
          [registries.forgejo]
          index = "$REGISTRY_INDEX"

          [net]
          git-fetch-with-cli = true
          EOF
          cat > "$CARGO_HOME/credentials.toml" <<EOF
          [registries.forgejo]
          token = "Bearer $FORGEJO_TOKEN"
          EOF
          chmod 600 "$CARGO_HOME/credentials.toml"

      - name: Initialize Cargo registry index (no-op if already present)
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          # Forgejo creates the _cargo-index repo on first publish, but we
          # poke the init endpoint defensively. A 4xx here is fine.
          curl -fsS -o /dev/null -X POST \
            -H "Authorization: token $FORGEJO_TOKEN" \
            https://forgejo.example-app.com/api/packages/leonardoventurini/cargo/_init || true

      - name: Build workspace
        # Prepend the cargo bin directory inline so cargo can find its
        # sibling toolchain binaries (rustc, rustdoc). PATH writes via
        # FORGEJO_PATH haven't been propagating reliably on this runner.
        run: |
          export PATH="$(dirname "$CARGO"):$PATH"
          $CARGO build --workspace --all-features

      - name: Publish crates in dependency order
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$(dirname "$CARGO"):$PATH"
          for crate in $CRATES; do
            version=$($CARGO metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            # Probe the registry for the exact version. The Forgejo
            # Cargo API returns 200 with a JSON body listing versions
            # when the crate exists, 404 otherwise.
            status=$(curl -s -o /tmp/probe.json -w '%{http_code}' \
              -H "Authorization: token $FORGEJO_TOKEN" \
              "$REGISTRY_API/$crate") || true
            if [ "$status" = "200" ] && jq -e ".versions[] | select(.num == \"$version\")" /tmp/probe.json >/dev/null 2>&1; then
              echo "skip $crate@$version (already published)"
              continue
            fi
            echo "publish $crate@$version"
            $CARGO publish -p "$crate" --registry forgejo --no-verify
            # Brief sleep so the next crate sees the index update.
            sleep 5
          done
