name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'bifrost-ts/**'
      - 'docs/conformance/**'
      - 'PROTOCOL.md'
      - '.forgejo/workflows/ci.yml'
  pull_request:
    paths:
      - 'bifrost-ts/**'
      - 'docs/conformance/**'
      - 'PROTOCOL.md'
      - '.forgejo/workflows/ci.yml'

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  ci-ts:
    name: CI (bifrost-ts)
    runs-on: arm64
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bifrost-ts
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      REDIS_URL: redis://m3ultra-256g.tail17a045.ts.net:6379
      BIFROST_MONGODB_TEST_URI: mongodb://127.0.0.1:27018/?replicaSet=bifrost-ci
      BIFROST_MONGODB_TEST_DB: bifrost_mongodb_ci_test
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install Bun
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          profile_state() {
            for profile in "$HOME/.zshrc" "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.profile" "$HOME/.zprofile"; do
              if [ -f "$profile" ]; then
                cksum "$profile"
              else
                printf 'missing %s\n' "$profile"
              fi
            done
          }

          profiles_before="$(profile_state)"
          BUN_INSTALL_ROOT="${RUNNER_TOOL_CACHE:-${AGENT_TOOLSDIRECTORY:-${RUNNER_TEMP:-$PWD/.forgejo-tools}}}/bun"
          BUN_INSTALL_HOME="$BUN_INSTALL_ROOT/home"
          BUN_INSTALL_BIN="$BUN_INSTALL_ROOT/bin"
          mkdir -p "$BUN_INSTALL_ROOT" "$BUN_INSTALL_HOME"

          if [ ! -x "$BUN_INSTALL_BIN/bun" ]; then
            curl -fsSL https://bun.sh/install \
              | HOME="$BUN_INSTALL_HOME" BUN_INSTALL="$BUN_INSTALL_ROOT" bash
          fi

          profiles_after="$(profile_state)"
          if [ "$profiles_before" != "$profiles_after" ]; then
            echo "Bun installer modified a real shell profile; refusing to continue." >&2
            exit 1
          fi

          echo "$BUN_INSTALL_BIN" >> "$FORGEJO_PATH"

      - uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: bifrost-ts/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('bifrost-ts/bun.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        timeout-minutes: 10

      # TypeScript
      - name: TypeScript
        run: bun run typecheck
        timeout-minutes: 5

      # Unit tests
      - name: Unit Tests
        run: bun run test:unit
        timeout-minutes: 10

      # Integration tests (Redis and a MongoDB replica set required)
      - name: MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          command -v mongod
          command -v mongosh
          MONGO_DATA_DIR="${RUNNER_TEMP}/bifrost-mongodb"
          mkdir -p "$MONGO_DATA_DIR"
          mongod \
            --bind_ip 127.0.0.1 \
            --dbpath "$MONGO_DATA_DIR" \
            --fork \
            --logpath "$MONGO_DATA_DIR/mongod.log" \
            --port 27018 \
            --replSet bifrost-ci
          mongosh --quiet --port 27018 --eval \
            'rs.initiate({_id:"bifrost-ci",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if mongosh --quiet --port 27018 --eval \
              'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$MONGO_DATA_DIR/mongod.log"
          exit 1
        timeout-minutes: 3

      - name: Integration Tests
        run: bun run test:integration
        timeout-minutes: 10

      # Browser tests
      - uses: https://data.forgejo.org/actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bifrost-ts/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: bunx playwright install --with-deps
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: bunx playwright install-deps
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Browser Tests
        run: bun run test:browser
        timeout-minutes: 10
        env:
          CI: true
