name: CI

on:
  push:
    branches: [main]
    paths:
      - "bifrost-ts/**"
      - "docs/conformance/**"
      - "PROTOCOL.md"
      - ".forgejo/workflows/ci.yml"
  pull_request:
    paths:
      - "bifrost-ts/**"
      - "docs/conformance/**"
      - "PROTOCOL.md"
      - ".forgejo/workflows/ci.yml"

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  ci-ts:
    name: CI (bifrost-ts)
    runs-on: arm64
    timeout-minutes: 35
    defaults:
      run:
        working-directory: bifrost-ts
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      REDIS_URL: redis://127.0.0.1:16379
      BIFROST_MONGODB_TEST_URI: mongodb://127.0.0.1:27018/?replicaSet=bifrost-ci
      BIFROST_MONGODB_TEST_DB: bifrost_mongodb_ci_test
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: bifrost-ts/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - run: npm ci
        timeout-minutes: 10

      - name: Security audit
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        # The host runner has returned status 1 after a fully passing parallel
        # Vitest summary; serial files remove that worker-shutdown race while
        # retaining Vitest's complete assertion contract.
        run: npm run test:unit -- --no-file-parallelism
        timeout-minutes: 10

      - name: Start integration services
        env:
          MONGO_CONTAINER: bifrost-mongodb-ci
          REDIS_CONTAINER: bifrost-redis-ci
        shell: bash
        run: |
          set -euo pipefail
          docker rm --force "$MONGO_CONTAINER" "$REDIS_CONTAINER" >/dev/null 2>&1 || true
          docker run --detach --rm \
            --name "$MONGO_CONTAINER" \
            --publish 127.0.0.1:27018:27018 \
            mongo:7.0 \
            mongod --bind_ip_all --port 27018 --replSet bifrost-ci
          docker run --detach --rm \
            --name "$REDIS_CONTAINER" \
            --publish 127.0.0.1:16379:6379 \
            redis:7.4-alpine
          for attempt in $(seq 1 60); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --port 27018 --eval \
              'db.adminCommand({ping:1})' >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec "$MONGO_CONTAINER" mongosh --quiet --port 27018 --eval \
            'rs.initiate({_id:"bifrost-ci",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 60); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --port 27018 --eval \
              'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null; then
              break
            fi
            sleep 1
          done
          docker exec "$MONGO_CONTAINER" mongosh --quiet --port 27018 --eval \
            'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$REDIS_CONTAINER" redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$MONGO_CONTAINER"
          docker logs "$REDIS_CONTAINER"
          exit 1
        timeout-minutes: 5

      - name: Integration tests
        run: npm run test:integration
        timeout-minutes: 10

      - name: Stop integration services
        if: always()
        env:
          MONGO_CONTAINER: bifrost-mongodb-ci
          REDIS_CONTAINER: bifrost-redis-ci
        run: docker stop "$MONGO_CONTAINER" "$REDIS_CONTAINER" || true

      - uses: https://data.forgejo.org/actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bifrost-ts/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npm exec -- playwright install --with-deps
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npm exec -- playwright install-deps
        timeout-minutes: 10
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Browser tests
        run: npm run test:browser
        timeout-minutes: 10
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Inspect package
        run: npm pack --dry-run

  publish-ts:
    name: Publish (bifrost-ts)
    needs: ci-ts
    runs-on: arm64
    if: >-
      forgejo.event_name == 'push'
      && forgejo.ref == 'refs/heads/main'
      && startsWith(forgejo.event.head_commit.message, 'chore(release):')
    defaults:
      run:
        working-directory: bifrost-ts
    env:
      NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      REGISTRY: https://forgejo.example-app.com/api/packages/leonardoventurini/npm/
    steps:
      # `needs: ci-ts` keeps publication on the same push SHA that passed CI;
      # Forgejo 16 does not provide GitHub's `workflow_run` trigger.
      - uses: https://data.forgejo.org/actions/checkout@v4

      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: bifrost-ts/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Resolve release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          version=$(node -p "require('./package.json').version")
          package_name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$FORGEJO_OUTPUT"
          echo "name=$package_name" >> "$FORGEJO_OUTPUT"

      - name: Skip if version already published
        id: gate
        shell: bash
        run: |
          set +e
          out=$(npm view "${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }}" version \
            --registry "$REGISTRY" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            test "$out" = "${{ steps.release.outputs.version }}"
            echo "already_published=true" >> "$FORGEJO_OUTPUT"
            echo "${{ steps.release.outputs.name }}@${{ steps.release.outputs.version }} is already on Forgejo; skipping."
          elif printf '%s' "$out" | grep -q 'E404'; then
            echo "already_published=false" >> "$FORGEJO_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            exit "$status"
          fi

      - run: npm ci
        if: steps.gate.outputs.already_published == 'false'

      - name: Security audit
        if: steps.gate.outputs.already_published == 'false'
        run: npm audit --audit-level=low

      - name: Build
        if: steps.gate.outputs.already_published == 'false'
        run: npm run build

      - name: Inspect package
        if: steps.gate.outputs.already_published == 'false'
        run: npm pack --dry-run

      - name: Publish
        if: steps.gate.outputs.already_published == 'false'
        run: npm publish --access public
