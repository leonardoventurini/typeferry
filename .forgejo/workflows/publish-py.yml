name: Publish (bifrost-py)

# Triggers on push to main when any Python package file changes.
# Idempotent: twine upload --skip-existing tolerates re-runs without
# version bumps.

on:
  push:
    branches: [main]
    paths:
      - 'bifrost-py/pyproject.toml'
      - 'bifrost-py/src/**'
      - 'bifrost-py/README.md'
      - '.forgejo/workflows/publish-py.yml'

concurrency:
  group: publish-py
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: arm64
    defaults:
      run:
        working-directory: bifrost-py
    env:
      TWINE_USERNAME: leonardoventurini
      TWINE_PASSWORD: ${{ secrets.FORGEJO_TOKEN }}
      TWINE_REPOSITORY_URL: https://forgejo.example-app.com/api/packages/leonardoventurini/pypi/
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Resolve system Python 3.13
        # The self-hosted arm64 runner has Python 3.13 from Homebrew.
        # We avoid setup-python@v5 because it tries to install into
        # /Users/runner, which the runner user can't write to.
        run: |
          if command -v python3.13 >/dev/null 2>&1; then
            python_bin=$(command -v python3.13)
          else
            python_bin=$(command -v python3)
          fi
          echo "PYTHON=$python_bin" >> "$FORGEJO_ENV"
          $python_bin --version

      - name: Install build tooling into an isolated venv
        run: |
          $PYTHON -m venv .ci-venv
          .ci-venv/bin/pip install --quiet --upgrade pip
          .ci-venv/bin/pip install --quiet build twine

      - name: Build sdist + wheel
        run: .ci-venv/bin/python -m build

      - name: Publish to Forgejo PyPI
        # --skip-existing makes the upload idempotent: re-runs without a
        # version bump succeed quietly instead of failing on the
        # registry's immutable-version constraint.
        run: .ci-venv/bin/python -m twine upload --skip-existing dist/*
