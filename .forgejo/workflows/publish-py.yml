name: Publish (bifrost-py)

# Triggers on push to main when any Python package file changes.
# Idempotent: twine upload --skip-existing tolerates re-runs without
# version bumps.

on:
  push:
    branches: [main]
    paths:
      - 'bifrost-py/pyproject.toml'
      - 'bifrost-py/src/**'
      - 'bifrost-py/README.md'
      - '.forgejo/workflows/publish-py.yml'

concurrency:
  group: publish-py
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: arm64
    defaults:
      run:
        working-directory: bifrost-py
    env:
      TWINE_USERNAME: leonardoventurini
      TWINE_PASSWORD: ${{ secrets.FORGEJO_TOKEN }}
      TWINE_REPOSITORY_URL: https://forgejo.example-app.com/api/packages/leonardoventurini/pypi/
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Resolve system Python 3.13
        # The self-hosted arm64 runner has Python 3.13 from Homebrew.
        # We avoid setup-python@v5 because it tries to install into
        # /Users/runner, which the runner user can't write to.
        run: |
          if command -v python3.13 >/dev/null 2>&1; then
            python_bin=$(command -v python3.13)
          else
            python_bin=$(command -v python3)
          fi
          echo "PYTHON=$python_bin" >> "$FORGEJO_ENV"
          $python_bin --version

      - name: Install build tooling into an isolated venv
        run: |
          $PYTHON -m venv ../.ci-venv-py
          ../.ci-venv-py/bin/pip install --quiet --upgrade pip
          ../.ci-venv-py/bin/pip install --quiet build twine

      - name: Resolve target version
        id: version
        run: |
          version=$(../.ci-venv-py/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          name=$(../.ci-venv-py/bin/python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          echo "version=$version" >> "$FORGEJO_OUTPUT"
          echo "name=$name" >> "$FORGEJO_OUTPUT"

      - name: Skip if version already published
        # Forgejo's PyPI registry does NOT support twine's
        # --skip-existing. Probe the simple index ourselves and
        # short-circuit when the wheel for this version is listed.
        id: gate
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          name="${{ steps.version.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          # PyPI normalizes underscores to dashes; the project uses
          # dashes already, but normalize defensively.
          slug=$(echo "$name" | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          url="https://forgejo.example-app.com/api/packages/leonardoventurini/pypi/simple/$slug/"
          body=$(curl -s -H "Authorization: token $FORGEJO_TOKEN" "$url" || true)
          if printf '%s' "$body" | grep -Eq "${slug//-/[-_]}-${version}(\.tar\.gz|-)"; then
            echo "already_published=true" >> "$FORGEJO_OUTPUT"
            echo "$slug@$version is already on Forgejo PyPI; skipping."
          else
            echo "already_published=false" >> "$FORGEJO_OUTPUT"
          fi

      - name: Build sdist + wheel
        if: steps.gate.outputs.already_published == 'false'
        run: ../.ci-venv-py/bin/python -m build

      - name: Publish to Forgejo PyPI
        if: steps.gate.outputs.already_published == 'false'
        run: ../.ci-venv-py/bin/python -m twine upload dist/*
