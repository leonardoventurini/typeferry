services:
  development:
    build:
      context: .
      dockerfile: Dockerfile.development
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      CLIENT_ORIGIN: http://localhost:8000
      DATABASE_URL: mongodb://mongodb:27017/typeferry-template?replicaSet=rs0&directConnection=true
      DEVELOP_ENV_FILE: /dev/null
      LOG_LEVEL: debug
      NODE_ENV: development
      PORT: 8002
      SAMPLE_AUTH_TOKEN: change-me-development-token
    ports:
      - '8000:8000'
      - '8002:8002'
    stop_signal: SIGINT
    volumes:
      - .:/app
      - development-node-modules:/app/node_modules

  mongodb:
    image: mongo:8
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      # Keep the starter usable in small local Docker VMs. Production MongoDB
      # should retain its operator-defined disk safety threshold.
      - --setParameter
      - indexBuildMinAvailableDiskSpaceMB=50
    restart: unless-stopped
    ports:
      - '27018:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host localhost --port 27017 --quiet --eval '
          try {
            if (rs.status().ok === 1 && db.hello().isWritablePrimary) quit(0);
            quit(1);
          } catch (error) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
            quit(1);
          }'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  development-node-modules:
  mongodb-data:
